name: ci
on:
  push: {branches: [main, master]}
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Download public Olist data and build the DuckDB star schema
        run: python -c "from src import download, build; download.main(); con = build.build(); build.export_kpis(con); con.close()"
      - run: python -m pytest -q
